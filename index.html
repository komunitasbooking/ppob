<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PPOB Komunitas</title>
    
    <!-- Memanggil File Manifest Resmi -->
    <link rel="manifest" href="manifest.json">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #ffffff; }
        iframe { border: none; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <!-- Iframe akan memuat tautan secara dinamis lewat JavaScript di bawah -->
    <iframe id="ppobApp" src=""></iframe>

    <script>
        // URL utama Google Apps Script PPOB Anda
        const baseGasUrl = "https://script.google.com/macros/s/AKfycbzCRuSiLElA8pjV9sMR08f2nEsth48MsnUJGUZaEwQw_9syJZJ26qwOJ8djqUPUWJ0Png/exec";

        // Ambil parameter ekor dari URL luar (jika ada, contoh: ?page=dashboard&user=aksa)
        const urlParams = window.location.search;

        // Gabungkan secara otomatis agar link tetap sinkron
        const finalGasUrl = urlParams ? baseGasUrl + urlParams : baseGasUrl;

        // Tembakkan tautan ke dalam iframe
        document.getElementById('ppobApp').src = finalGasUrl;

        // Pendaftaran Service Worker PWA agar aplikasi terdeteksi di Android
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log("PWA PPOB Siap!"))
            .catch(err => console.log("SW Gagal:", err));
        }
    </script>
</body>
</html>
